# Runs the jsdom suite in tests/ on every push and pull request. It boots the
# real index.html with its app.css and app.js, so a red run here means the
# files GitHub Pages is about to serve are wrong.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm test
      # index.html has been committed as binary/CRLF before, which turns every
      # diff into a full-file rewrite. Fail loudly if it, or the app's other two
      # files, ever are again.
      - name: index.html, app.css and app.js are UTF-8 text with LF endings and no NUL bytes
        working-directory: .
        run: |
          for f in index.html app.css app.js; do
            if [ "$(tr -cd '\000' < "$f" | wc -c)" -ne 0 ]; then echo "$f contains NUL bytes"; exit 1; fi
            if grep -q $'\r' "$f"; then echo "$f contains CR line endings"; exit 1; fi
            file "$f" | grep -q 'UTF-8 text\|ASCII text\|JavaScript' || { file "$f"; exit 1; }
          done
